[package]
name = "replaykit-replay-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "replaykit_replay_engine"
path = "src/lib.rs"

[dependencies]
replaykit-core-model = { path = "../core-model" }
replaykit-storage = { path = "../storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
replaykit-collector = { path = "../collector" }
